<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Анонимный мессенджер</title>
<style>
:root{--bg:#fff;--tx:#111;--sub:#707579;--acc:#3390ec;--out:#eeffde;--in:#fff;--line:#e7e7e7;--hov:#f4f4f5;--wall:#cfdcc4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#212121;--tx:#f5f5f5;--sub:#8d9499;--acc:#8774e1;--out:#766ac8;--in:#2b2b2b;--line:#303030;--hov:#2c2c2c;--wall:#0f0f0f}}
:root[data-theme="dark"]{--bg:#212121;--tx:#f5f5f5;--sub:#8d9499;--acc:#8774e1;--out:#766ac8;--in:#2b2b2b;--line:#303030;--hov:#2c2c2c;--wall:#0f0f0f}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,"Segoe UI",Roboto,sans-serif}
button,input{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
input{background:var(--hov);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none;width:100%}
input:focus{border-color:var(--acc)}
.pri{background:var(--acc);color:#fff;border-radius:10px;padding:10px 16px}
#auth{max-width:340px;margin:12vh auto;padding:20px;display:flex;flex-direction:column;gap:12px;text-align:center}
#auth h1{margin:0;font-size:22px}.err{color:#e5484d;min-height:20px;font-size:13px}.sub{color:var(--sub);font-size:13px}
#app{display:grid;grid-template-columns:340px 1fr;height:100%}
aside{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.top{padding:10px}#list{flex:1;overflow:auto}
.row{display:flex;gap:10px;padding:9px 12px;align-items:center;cursor:pointer}.row:hover{background:var(--hov)}.row.on{background:var(--acc);color:#fff}.row.on .sub{color:#e8e8ff}
.av{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:600}
.mid{flex:1;min-width:0}.mid b,.mid .sub{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bd{background:var(--acc);color:#fff;border-radius:12px;min-width:20px;padding:0 6px;text-align:center;font-size:12px}
.row.on .bd{background:#fff;color:var(--acc)}
#nav{display:flex;border-top:1px solid var(--line)}#nav button{flex:1;padding:12px;color:var(--sub)}#nav button.on{color:var(--acc);font-weight:600}
main{display:flex;flex-direction:column;min-height:0;background:var(--wall);position:relative}
#empty{margin:auto;background:#0003;color:#fff;padding:4px 14px;border-radius:14px}
#cv{display:flex;flex-direction:column;height:100%}
#hd{background:var(--bg);padding:8px 12px;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line)}
#back{display:none;font-size:22px;color:var(--acc)}
#msgs{flex:1;overflow:auto;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.m{max-width:min(78%,420px);padding:6px 10px;border-radius:12px;background:var(--in);word-wrap:break-word;white-space:pre-wrap}
.m.me{align-self:flex-end;background:var(--out)}.m.me{color:var(--tx)}
:root[data-theme="dark"] .m.me{color:#fff}
.m .n{color:var(--acc);font-size:12px;font-weight:600}.m .t{font-size:11px;color:var(--sub);text-align:right}
audio{height:36px;max-width:100%}
.circ{width:200px;height:200px;border-radius:50%;object-fit:cover;background:#000;display:block;cursor:pointer}
#cmp{background:var(--bg);padding:8px;display:flex;gap:6px;align-items:center;border-top:1px solid var(--line)}
#cmp input{border-radius:20px}.ic{font-size:20px;padding:6px 8px;border-radius:50%}
#recbar{display:none;flex:1;align-items:center;gap:10px}#recbar i{width:10px;height:10px;border-radius:50%;background:#e5484d;animation:b 1s infinite}
@keyframes b{50%{opacity:.2}}
#prev{position:absolute;right:16px;bottom:80px;width:160px;height:160px;border-radius:50%;object-fit:cover;border:3px solid var(--acc);display:none;background:#000}
#modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;z-index:9}
#modal[hidden]{display:none}#box{background:var(--bg);border-radius:14px;padding:16px;width:min(360px,92vw);max-height:80vh;overflow:auto;display:flex;flex-direction:column;gap:10px}
#toast{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:10px;background:var(--bg);border:1px solid var(--line);border-left:4px solid var(--acc);padding:10px 14px;border-radius:10px;box-shadow:0 4px 16px #0004;display:none;z-index:10;cursor:pointer}
.set{padding:12px;display:flex;flex-direction:column;gap:10px}.set label{display:flex;justify-content:space-between;align-items:center;gap:8px}
[hidden]{display:none!important}
@media(max-width:700px){#app{grid-template-columns:1fr}main{display:none}#app.open aside{display:none}#app.open main{display:flex}#back{display:block}}
</style></head><body>
<div id="auth" hidden>
 <h1>Анонимный мессенджер</h1><div class="sub">Без номера телефона. Только уникальный @username.</div>
 <input id="au" placeholder="@username (a-z, 0-9, _)" maxlength="20" autocapitalize="off">
 <input id="an" placeholder="Имя (необязательно)" maxlength="30">
 <input id="ap" type="password" placeholder="Пароль (мин. 6 символов)" autocomplete="current-password"><button class="pri" id="ago">Создать аккаунт</button><button id="asw" class="sub"></button><div class="err" id="ae"></div>
</div>
<div id="app" hidden>
 <aside><div class="top"><input id="q" placeholder="Поиск людей по @username"></div><div id="list"></div>
  <nav id="nav"><button data-t="chats">Чаты</button><button data-t="contacts">Контакты</button><button data-t="settings">Настройки</button></nav></aside>
 <main><div id="empty">Выберите чат</div>
  <section id="cv" hidden>
   <div id="hd"><button id="back">‹</button><div class="av" id="hav"></div><div class="mid"><b id="htl"></b><span class="sub" id="hsb"></span></div></div>
   <div id="msgs"></div><video id="prev" muted playsinline></video>
   <div id="cmp"><input id="tx" placeholder="Сообщение" autocomplete="off"><div id="recbar"><i></i><span id="rt">0:00</span><button id="rc">✕</button></div>
    <button class="ic" id="bv" title="Голосовое">🎤</button><button class="ic" id="bc" title="Кружок">⭕</button><button class="ic" id="bs" title="Отправить">➤</button></div>
  </section></main>
</div>
<div id="modal" hidden><div id="box"></div></div><div id="toast"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={g(k){try{return localStorage.getItem(k)}catch(e){return null}},s(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const S={me:ls.g('me'),users:{},chats:{},cur:null,tab:'chats',q:'',un:{},t0:Date.now(),snd:ls.g('snd')!=='0',reads:JSON.parse(ls.g('reads')||'{}'),shown:new Set()};
let db,msgUn=null,Q=Promise.resolve(),R=null;
const COL=['#e17076','#7bc862','#e5ca77','#65aadd','#a695e7','#ee7aae','#6ec9cb','#faa774'];
const col=s=>COL[[...s].reduce((a,c)=>a+c.charCodeAt(0),0)%8];
const av=(s,t)=>`<div class="av" style="background:${col(s)}">${esc((t||s)[0]||'?').toUpperCase()}</div>`;
const tm=t=>new Date(t).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
const uname=u=>S.users[u]?.name||u;
const dmId=(a,b)=>'dm_'+[a,b].sort().join('__');
const other=c=>c.members.find(m=>m!==S.me)||S.me;
const ctitle=(id)=>{const c=S.chats[id];return c.type==='group'?c.title:uname(other(c))};
function toast(t,f){const e=$('#toast');e.textContent=t;e.style.display='block';e.onclick=()=>{e.style.display='none';f&&f()};clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display='none',5000)}
function beep(){if(!S.snd)return;try{const a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=800;g.gain.setValueAtTime(.08,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.25);o.start();o.stop(a.currentTime+.25)}catch(e){}}
function badge(){const n=Object.values(S.un).reduce((a,b)=>a+b,0);document.title=(n?`(${n}) `:'')+'Мессенджер'}
function unread(id){const c=S.chats[id];if(S.un[id])return S.un[id];return c.last&&c.last.from!==S.me&&c.last.t>(S.reads[id]||0)?1:0}
function markRead(id){S.un[id]=0;const c=S.chats[id];S.reads[id]=Math.max(Date.now(),c?.last?.t||0);ls.s('reads',JSON.stringify(S.reads));badge()}

/* ---------- auth ---------- */
let AM='reg';const EM=u=>u+'@messenger.app';
function setMode(m){AM=m;$('#an').hidden=m==='login';$('#ago').textContent=m==='reg'?'Создать аккаунт':'Войти';$('#asw').textContent=m==='reg'?'Уже есть аккаунт? Войти':'Нет аккаунта? Регистрация';$('#ae').textContent=''}
async function boot(user){S.uid=user.uid;S.me=user.email.split('@')[0];const r=db.doc('users/'+S.me),x=await r.get();
 if(!x.exists)await r.set({username:S.me,name:$('#an').value.trim()||S.me,createdAt:Date.now(),contacts:[],owner:S.uid});enter()}
async function register(){
 const u=$('#au').value.trim().replace(/^@/,'').toLowerCase(),n=$('#an').value.trim()||u,p=$('#ap').value,e=$('#ae');e.textContent='';
 if(!/^[a-z][a-z0-9]*(_[a-z0-9]+)*$/.test(u)||u.length<3){e.textContent='Ник: 3–20 символов, латиница/цифры, _ только внутри';return}
 if(p.length<6){e.textContent='Пароль — минимум 6 символов';return}
 $('#ago').disabled=true;
 try{const A=firebase.auth();
  if(AM==='login'){const c=await A.signInWithEmailAndPassword(EM(u),p);await boot(c.user)}
  else{const c=await A.createUserWithEmailAndPassword(EM(u),p);S.uid=c.user.uid;const r=db.doc('users/'+u);
   try{await db.runTransaction(async tx=>{if((await tx.get(r)).exists)throw{code:'taken'};tx.set(r,{username:u,name:n,createdAt:Date.now(),contacts:[],owner:S.uid})})}
   catch(x){await c.user.delete().catch(()=>{});throw x}
   S.me=u;enter()}
 }catch(x){const k=x.code||'',M={'auth/email-already-in-use':'Ник @'+u+' уже занят','taken':'Ник @'+u+' уже занят','permission-denied':'Ник @'+u+' уже занят','auth/invalid-credential':'Неверный ник или пароль','auth/wrong-password':'Неверный ник или пароль','auth/user-not-found':'Неверный ник или пароль','auth/too-many-requests':'Слишком много попыток, подождите','auth/operation-not-allowed':'В Firebase не включён вход Email/Password','auth/weak-password':'Слишком простой пароль'};
  e.textContent=M[k]||'Ошибка: '+(k||x.message)}finally{$('#ago').disabled=false}
}
function enter(){$('#auth').hidden=true;$('#app').hidden=false;S.t0=Date.now();
 db.collection('users').onSnapshot(s=>{S.users={};s.docs.forEach(d=>{const x=d.data();if(x&&x.username)S.users[d.id]=x});render();if(S.cur)head()},e=>toast('Ошибка: '+e.code));
 db.collection('chats').where('uids','array-contains',S.uid).onSnapshot(s=>{
  S.chats={};s.docs.forEach(d=>S.chats[d.id]=d.data());
  s.docChanges().forEach(ch=>{if(ch.type==='removed')return;const c=ch.doc.data(),id=ch.doc.id;
   if(c.last&&c.last.from!==S.me&&c.last.t>S.t0&&!S.seen?.[id+c.last.t]){(S.seen=S.seen||{})[id+c.last.t]=1;
    if(S.cur===id&&!document.hidden){markRead(id)}else{S.un[id]=(S.un[id]||0)+1;badge();beep();
     const body=c.last.k==='voice'?'🎤 Голосовое':c.last.k==='circle'?'⭕ Кружок':c.last.text;
     const T=c.type==='group'?c.title+': '+uname(c.last.from):uname(c.last.from);toast(T+' — '+body,()=>openChat(id));
     try{if(window.Notification&&Notification.permission==='granted'&&ls.g('ntf')!=='0')new Notification(T,{body})}catch(e){}}}});
  render()},e=>toast('Ошибка: '+e.code));
 render()}

/* ---------- sidebar ---------- */
function chatRow(id){const c=S.chats[id],t=ctitle(id),u=unread(id),l=c.last;
 return `<div class="row ${S.cur===id?'on':''}" data-chat="${esc(id)}">${av(c.type==='group'?t:other(c),t)}<div class="mid"><b>${esc(t)}</b><span class="sub">${l?esc((l.from===S.me?'Вы: ':c.type==='group'?uname(l.from)+': ':'')+(l.k==='voice'?'🎤 Голосовое':l.k==='circle'?'⭕ Кружок':l.text)):'Нет сообщений'}</span></div>${l?`<span class="sub">${tm(l.t)}</span>`:''}${u?`<span class="bd">${u}</span>`:''}</div>`}
function userRow(u,add){const x=S.users[u],has=(S.users[S.me]?.contacts||[]).includes(u);
 return `<div class="row" data-dm="${esc(u)}">${av(u,x.name)}<div class="mid"><b>${esc(x.name)}</b><span class="sub">@${esc(u)}</span></div>${add&&!has&&u!==S.me?`<button class="ic" data-add="${esc(u)}" title="В контакты">➕</button>`:''}</div>`}
function render(){if($('#app').hidden)return;
 document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===S.tab));
 const L=$('#list'),q=S.q.replace(/^@/,'').toLowerCase();let h='';
 if(q){const f=Object.keys(S.users).filter(u=>u!==S.me&&(u.includes(q)||S.users[u].name.toLowerCase().includes(q))).sort();
  h=`<div class="sub" style="padding:8px 12px">Найдено: ${f.length}</div>`+f.map(u=>userRow(u,1)).join('')}
 else if(S.tab==='chats'){const ids=Object.keys(S.chats).filter(i=>S.chats[i].last||S.chats[i].by===S.me).sort((a,b)=>(S.chats[b].lastAt||0)-(S.chats[a].lastAt||0));
  h=ids.length?ids.map(chatRow).join(''):'<div class="sub" style="padding:20px;text-align:center">Чатов пока нет.<br>Найдите человека по @username в поиске.</div>'}
 else if(S.tab==='contacts'){const cs=(S.users[S.me]?.contacts||[]).filter(u=>S.users[u]);
  h=`<div class="row" id="ng"><div class="av" style="background:var(--acc)">👥</div><b>Создать группу</b></div>`+(cs.length?cs.map(u=>userRow(u)).join(''):'<div class="sub" style="padding:20px;text-align:center">Контактов нет. Найдите людей через поиск и нажмите ➕</div>')}
 else{const me=S.users[S.me]||{};h=`<div class="set"><div style="display:flex;gap:10px;align-items:center">${av(S.me,me.name)}<div><b>${esc(me.name||S.me)}</b><div class="sub">@${esc(S.me)}</div></div></div>
  <input id="sn" value="${esc(me.name||'')}" maxlength="30" placeholder="Имя"><button class="pri" id="sv">Сохранить имя</button>
  <label>Тема<select id="th"><option value="">Авто</option><option value="light">Светлая</option><option value="dark">Тёмная</option></select></label>
  <label>Уведомления<input type="checkbox" id="nt" style="width:auto" ${ls.g('ntf')!=='0'&&window.Notification&&Notification.permission==='granted'?'checked':''}></label>
  <label>Звук<input type="checkbox" id="sd" style="width:auto" ${S.snd?'checked':''}></label>
  <button id="pw" style="color:var(--acc);text-align:left">Сменить пароль</button><button id="lo" style="color:#e5484d;text-align:left">Выйти из аккаунта</button><div class="sub">Вход по нику и паролю с любого устройства. Восстановления пароля нет — сохраните его.</div></div>`}
 L.innerHTML=h;const th=$('#th');if(th)th.value=ls.g('theme')||''}

/* ---------- chat ---------- */
async function openDM(u){const id=dmId(S.me,u);
 if(!S.chats[id]){S.chats[id]={type:'dm',members:[S.me,u],uids:[S.uid,S.users[u].owner],by:S.me,lastAt:0};
  try{await db.doc('chats/'+id).set({type:'dm',members:[S.me,u],uids:[S.uid,S.users[u].owner],by:S.me,lastAt:0})}catch(e){toast('Не удалось создать чат: '+e.code);return}}
 S.q='';$('#q').value='';openChat(id)}
function head(){const id=S.cur,c=S.chats[id];if(!c)return;const t=ctitle(id);
 $('#hav').outerHTML=av(c.type==='group'?t:other(c),t).replace('class="av"','class="av" id="hav"');$('#htl').textContent=t;
 $('#hsb').textContent=c.type==='group'?c.members.length+' участн.: '+c.members.map(uname).join(', '):'@'+other(c)}
function openChat(id){S.cur=id;markRead(id);$('#empty').hidden=true;$('#cv').hidden=false;$('#app').classList.add('open');
 $('#msgs').innerHTML='';S.shown=new Set();head();render();msgUn&&msgUn();
 msgUn=db.collection('chats/'+id+'/messages').orderBy('t','desc').limit(100).onSnapshot(s=>{
  if(S.cur!==id)return;const box=$('#msgs'),near=box.scrollHeight-box.scrollTop-box.clientHeight<120;
  s.docs.slice().reverse().forEach(d=>{if(S.shown.has(d.id))return;S.shown.add(d.id);box.insertAdjacentHTML('beforeend',bubble(d.data()))});
  if(near||!box.dataset.init){box.scrollTop=box.scrollHeight;box.dataset.init=1}},e=>toast('Ошибка: '+e.code))}
function bubble(m){const me=m.from===S.me,g=S.chats[S.cur]?.type==='group';let b='';
 if(m.type==='voice'&&/^data:audio\//.test(m.data))b=`<audio controls preload="metadata" src="${m.data}"></audio>`;
 else if(m.type==='circle'&&/^data:video\//.test(m.data))b=`<video class="circ" playsinline loop src="${m.data}" onclick="this.paused?this.play():this.pause()"></video>`;
 else b=esc(m.text||'');
 return `<div class="m ${me?'me':''}">${g&&!me?`<div class="n">${esc(uname(m.from))}</div>`:''}${b}<div class="t">${tm(m.t)}</div></div>`}
function send(m){const id=S.cur;if(!id)return;Q=Q.then(async()=>{const t=Date.now();
 try{await db.collection('chats/'+id+'/messages').add({from:S.me,t,...m});
  await db.doc('chats/'+id).update({last:{from:S.me,t,k:m.type,text:m.type==='text'?m.text:''},lastAt:t})}
 catch(e){toast(e.code==='quota_exceeded'?'Хранилище заполнено (лимит документов)':'Не отправлено: '+(e.code||e.message))}})}
function sendText(){const v=$('#tx').value.trim();if(!v)return;$('#tx').value='';send({type:'text',text:v.slice(0,4000)})}

/* ---------- voice & circles ---------- */
async function startRec(kind){if(R)return;
 if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){toast('Запись не поддерживается в этом браузере');return}
 let st;try{st=await navigator.mediaDevices.getUserMedia(kind==='circle'?{audio:true,video:{width:240,height:240,facingMode:'user'}}:{audio:true})}
 catch(e){toast('Нет доступа к микрофону/камере. Разрешите его в браузере');return}
 const max=kind==='circle'?8:60,ch=[],mr=new MediaRecorder(st,{audioBitsPerSecond:16000,videoBitsPerSecond:110000});
 R={mr,st,cancel:false,t0:Date.now()};mr.ondataavailable=e=>e.data.size&&ch.push(e.data);
 mr.onstop=()=>{st.getTracks().forEach(t=>t.stop());$('#prev').style.display='none';$('#prev').srcObject=null;ui(false);const c=R.cancel,dur=Math.round((Date.now()-R.t0)/1000);clearInterval(R.iv);R=null;
  if(c||!ch.length)return;const fr=new FileReader();fr.onload=()=>{if(fr.result.length>240000){toast('Запись слишком большая — сделайте короче');return}send({type:kind,data:fr.result,dur})};fr.readAsDataURL(new Blob(ch,{type:mr.mimeType}))};
 if(kind==='circle'){$('#prev').srcObject=st;$('#prev').style.display='block';$('#prev').play()}
 mr.start();ui(true);R.iv=setInterval(()=>{const s=Math.floor((Date.now()-R.t0)/1000);$('#rt').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')+' / '+max+'с';if(s>=max)stopRec()},250)}
function stopRec(c){if(!R)return;R.cancel=!!c;R.mr.state!=='inactive'&&R.mr.stop()}
function ui(on){$('#tx').style.display=on?'none':'';$('#recbar').style.display=on?'flex':'none';$('#bv').hidden=$('#bc').hidden=on}

/* ---------- groups ---------- */
function groupModal(){const us=Object.keys(S.users).filter(u=>u!==S.me).sort();
 $('#box').innerHTML=`<b>Новая группа</b><input id="gt" placeholder="Название" maxlength="40">${us.length?us.map(u=>`<label class="row" style="padding:4px"><input type="checkbox" style="width:auto" value="${esc(u)}">${esc(uname(u))} <span class="sub">@${esc(u)}</span></label>`).join(''):'<div class="sub">Пока нет других пользователей</div>'}<div style="display:flex;gap:8px"><button class="pri" id="gok">Создать</button><button id="gno">Отмена</button></div>`;$('#modal').hidden=false;
 $('#gno').onclick=()=>$('#modal').hidden=true;
 $('#gok').onclick=async()=>{const t=$('#gt').value.trim(),m=[...document.querySelectorAll('#box input[type=checkbox]:checked')].map(i=>i.value);
  if(!t||!m.length){toast('Нужны название и хотя бы один участник');return}
  const id='g_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),n=Date.now(),c={type:'group',title:t,members:[S.me,...m],uids:[S.uid,...m.map(x=>S.users[x].owner)],by:S.me,lastAt:n,last:{from:S.me,t:n,k:'text',text:'Группа создана'}};
  try{await db.doc('chats/'+id).set(c);S.chats[id]=c;$('#modal').hidden=true;openChat(id)}catch(e){toast('Ошибка: '+e.code)}}}

/* ---------- events ---------- */
document.addEventListener('click',async e=>{const t=e.target,c=t.closest('[data-chat]'),d=t.closest('[data-dm]'),a=t.closest('[data-add]');
 if(a){e.stopPropagation();const me=S.users[S.me];try{await db.doc('users/'+S.me).update({contacts:[...new Set([...(me.contacts||[]),a.dataset.add])]});toast('Добавлен в контакты')}catch(x){toast('Ошибка: '+x.code)}return}
 if(c)return openChat(c.dataset.chat);if(d)return openDM(d.dataset.dm);
 const nb=t.closest('#nav button');if(nb){S.tab=nb.dataset.t;S.q='';$('#q').value='';render()}
 if(t.closest('#ng'))groupModal();
 if(t.id==='sv'){try{await db.doc('users/'+S.me).update({name:$('#sn').value.trim()||S.me});toast('Сохранено')}catch(x){toast('Ошибка')}}
 if(t.id==='lo'){firebase.auth().signOut().then(()=>location.reload())}
 if(t.id==='pw'){const p=prompt('Новый пароль (минимум 6 символов)');if(p&&p.length>=6){try{await firebase.auth().currentUser.updatePassword(p);toast('Пароль изменён')}catch(x){toast(x.code==='auth/requires-recent-login'?'Выйдите, войдите заново и повторите':'Ошибка: '+x.code)}}else if(p)toast('Минимум 6 символов')}
 if(t.id==='back'){$('#app').classList.remove('open');S.cur=null;msgUn&&msgUn();render()}
 if(t.id==='bs')sendText();if(t.id==='bv')startRec('voice');if(t.id==='bc')startRec('circle');if(t.id==='rc')stopRec(1);
 if(t.id==='modal')t.hidden=true});
document.addEventListener('change',async e=>{const t=e.target;
 if(t.id==='th'){ls.s('theme',t.value);t.value?document.documentElement.dataset.theme=t.value:delete document.documentElement.dataset.theme}
 if(t.id==='sd'){S.snd=t.checked;ls.s('snd',t.checked?'1':'0')}
 if(t.id==='nt'){if(t.checked){try{const p=await Notification.requestPermission();t.checked=p==='granted';ls.s('ntf',t.checked?'1':'0');if(!t.checked)toast('Уведомления заблокированы браузером')}catch(x){t.checked=false;toast('Уведомления недоступны в этом окне')}}else ls.s('ntf','0')}});
$('#q').oninput=e=>{S.q=e.target.value.trim();render()};
$('#tx').onkeydown=e=>{if(e.key==='Enter')sendText()};
$('#au').onkeydown=$('#an').onkeydown=$('#ap').onkeydown=e=>{if(e.key==='Enter')register()};$('#asw').onclick=()=>setMode(AM==='reg'?'login':'reg');$('#ago').onclick=register;
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.cur)markRead(S.cur),render()});
if(ls.g('theme'))document.documentElement.dataset.theme=ls.g('theme');

(async()=>{
 try{firebase.initializeApp(window.FIREBASE_CONFIG);db=firebase.firestore()}
 catch(e){document.body.innerHTML='<div style="padding:30px;text-align:center">Не удалось подключиться к Firebase. Проверьте firebase-config.js.<br><small>'+esc(e.code||e.message)+'</small></div>';return}
 setMode('reg');let un;un=firebase.auth().onAuthStateChanged(async u=>{un&&un();if(u&&u.email){try{await boot(u)}catch(e){$('#auth').hidden=false}}else $('#auth').hidden=false})})();
</script></body></html>
