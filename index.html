<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<style>
:root{--bg:#f5f5fa;--tx:#15151d;--sub:#6b6f80;--acc:#6c5ce7;--acc2:#4f7fff;--out:rgba(108,92,231,.16);--in:rgba(255,255,255,.9);--line:#e4e4ee;--hov:#ececf5;--wall:#e7e7f3;--glass:rgba(255,255,255,.68);--glassb:rgba(30,30,50,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0b12;--tx:#f2f2f8;--sub:#8b8fa8;--acc:#7c6cf0;--acc2:#5b8cff;--out:rgba(124,108,240,.35);--in:rgba(30,30,42,.65);--line:#232336;--hov:#1a1a26;--wall:#07070d;--glass:rgba(18,18,28,.62);--glassb:rgba(255,255,255,.08)}}
:root[data-theme="dark"]{--bg:#0b0b12;--tx:#f2f2f8;--sub:#8b8fa8;--acc:#7c6cf0;--acc2:#5b8cff;--out:rgba(124,108,240,.35);--in:rgba(30,30,42,.65);--line:#232336;--hov:#1a1a26;--wall:#07070d;--glass:rgba(18,18,28,.62);--glassb:rgba(255,255,255,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior-y:contain}
@supports (height:100dvh){html,body{height:100dvh}}
/* iOS Safari увеличивает страницу при фокусе на поле с размером шрифта
   меньше 16px — из-за этого «всё едет». Держим инпуты не мельче 16px. */
input,textarea,select{font-size:16px}
@media(min-width:701px){input,textarea,select{font-size:15px}}
body{background:radial-gradient(circle at 12% 8%,#7c6cf03d 0,transparent 42%),radial-gradient(circle at 88% 6%,#5b8cff33 0,transparent 42%),radial-gradient(circle at 50% 100%,#7c6cf026 0,transparent 55%),var(--bg);background-attachment:fixed;color:var(--tx);font:15px/1.4 -apple-system,"Segoe UI",Roboto,sans-serif}
button,input{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none;touch-action:manipulation}
input,textarea{background:var(--hov);border:1px solid var(--line);border-radius:14px;padding:10px 12px;outline:none;width:100%;font:inherit;color:inherit}
input:focus,textarea:focus{border-color:var(--acc)}
.pri{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-radius:14px;padding:11px 16px;font-weight:600;box-shadow:0 6px 18px -6px #6c5ce780;transition:transform .15s,box-shadow .15s}
.pri:hover{transform:translateY(-1px);box-shadow:0 10px 22px -6px #6c5ce7a0}
.pri:active{transform:translateY(0)}
.pri:disabled{opacity:.6;transform:none;box-shadow:none}
.sec{background:transparent;color:var(--tx);border:1.5px solid var(--glassb);border-radius:14px;padding:10px 16px;font-weight:600}
.sec:hover{background:var(--hov)}
#authwrap{max-width:380px;margin:0 auto;min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px 18px}
#auth{width:100%;padding:26px 22px;display:flex;flex-direction:column;gap:12px;text-align:center;border-radius:26px;background:var(--glass);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);border:1px solid var(--glassb);box-shadow:0 24px 60px -20px #00000055}
#auth h1{margin:2px 0 0;font-size:23px;letter-spacing:.5px}
#alogo{width:88px;height:88px;margin:0 auto 2px;filter:drop-shadow(0 8px 24px #6c5ce766)}
#atag{color:var(--sub);font-size:13px;margin-top:-8px}
.err{color:#e5484d;min-height:20px;font-size:13px}.sub{color:var(--sub);font-size:13px}
#authland{display:flex;flex-direction:column;gap:10px}
#authform{display:flex;flex-direction:column;gap:12px}
#authform[hidden],#authland[hidden]{display:none}
#backland{align-self:flex-start;color:var(--acc);font-weight:600;font-size:13px;padding:4px 0}
#app{display:grid;grid-template-columns:340px 1fr;height:100%}
#sidehead{display:flex;align-items:center;gap:8px;padding:10px 12px 0}
#sidehead svg{width:26px;height:26px;flex:none}
#sidehead b{font-size:15px;letter-spacing:.4px;font-weight:700}
aside{border-right:1px solid var(--glassb);display:flex;flex-direction:column;min-height:0}
.top{padding:10px}#list{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.row{display:flex;gap:10px;padding:9px 12px;align-items:center;cursor:pointer;touch-action:manipulation}.row:hover{background:var(--hov)}.row.on{background:var(--acc);color:#fff}.row.on .sub{color:#e8e8ff}
.av{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:600;overflow:hidden}
.mid{flex:1;min-width:0}.mid b,.mid .sub{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bd{background:var(--acc);color:#fff;border-radius:12px;min-width:20px;padding:0 6px;text-align:center;font-size:12px}
.row.on .bd{background:#fff;color:var(--acc)}
#nav{display:flex;border-top:1px solid var(--glassb)}#nav button{flex:1;padding:12px;color:var(--sub)}#nav button.on{color:var(--acc);font-weight:600}
main{display:flex;flex-direction:column;min-height:0;background:var(--wall);position:relative}
#empty{margin:auto;background:#0003;color:#fff;padding:4px 14px;border-radius:14px}
#cv{display:flex;flex-direction:column;height:100%}
#hd{background:var(--glass);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);padding:8px 12px;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--glassb)}
#back{display:none;font-size:22px;color:var(--acc)}
#msgs{flex:1;overflow:auto;padding:10px 12px;display:flex;flex-direction:column;gap:4px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.m{max-width:min(78%,420px);padding:6px 10px;border-radius:14px;background:var(--in);backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);border:1px solid var(--glassb);word-wrap:break-word;white-space:pre-wrap;position:relative}
.m.me{align-self:flex-end;background:var(--out);color:var(--tx)}
:root[data-theme="dark"] .m.me{color:#fff}
.m .n{color:var(--acc);font-size:12px;font-weight:600;display:flex;align-items:center;gap:2px}.m .t{font-size:11px;color:var(--sub);text-align:right;display:flex;align-items:center;justify-content:flex-end;gap:2px}
.cmtbtn{display:block;width:100%;margin-top:4px;padding-top:6px;border-top:1px solid var(--glassb);text-align:center;font-size:12.5px;color:var(--acc);font-weight:600}
.m.flash{animation:fl .9s}@keyframes fl{0%,100%{box-shadow:none}30%{box-shadow:0 0 0 3px var(--acc)}}
audio{height:36px;max-width:100%}
/* --- звонки --- */
#callui{position:fixed;inset:0;z-index:20;background:#0b0b10;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;
 padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(26px + env(safe-area-inset-bottom,0px))}
#callui[hidden],#ringui[hidden]{display:none}
#rv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#0b0b10;display:none}
#callui.hasvideo #rv{display:block}
#callui.hasvideo #cpeer{display:none}
#lv{position:absolute;right:14px;top:calc(14px + env(safe-area-inset-top,0px));width:104px;height:140px;object-fit:cover;border-radius:16px;border:2px solid #ffffff40;background:#000;z-index:2;display:none}
#callui.hasme #lv{display:block}
#cpeer{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
#cpeer .av{width:120px;height:120px;font-size:44px}
#cname{font-size:21px;font-weight:600}
#cstat{color:#ffffffb3;font-size:14px}
#cbtns{position:absolute;bottom:calc(30px + env(safe-area-inset-bottom,0px));display:flex;gap:18px;z-index:3}
.cb{width:62px;height:62px;border-radius:50%;background:#ffffff26;font-size:25px;color:#fff;display:grid;place-items:center;flex:none}
.cb.off{background:#fff;color:#111}
.cb.end{background:#e5484d}
.cb.acc{background:#31c55e}
.cb[hidden]{display:none}
#ringui{position:fixed;inset:0;z-index:21;background:#000000cc;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:grid;place-items:center;color:#fff;
 padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(26px + env(safe-area-inset-bottom,0px))}
#ringbox{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
#ringbox .av{width:110px;height:110px;font-size:40px;animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 #ffffff33}50%{box-shadow:0 0 0 18px #ffffff00}}
#rname{font-size:21px;font-weight:600}
#rkind{color:#ffffffb3;font-size:14px}
/* --- несколько аккаунтов --- */
.accrow{display:flex;gap:10px;align-items:center;padding:7px 8px;border-radius:12px;cursor:pointer}
.accrow:hover{background:var(--hov)}
.accrow.cur{background:var(--acc);color:#fff}.accrow.cur .sub{color:#e8e8ff}
.accrow .mid{min-width:0;flex:1}
#accpick{display:flex;flex-direction:column;gap:2px;margin:4px 0 8px}
#authaccs{display:flex;flex-direction:column;gap:4px;width:100%;margin-bottom:6px}
#authaccs .accrow{border:1px solid var(--line)}
.att-img{max-width:260px;max-height:320px;border-radius:12px;display:block;cursor:pointer;object-fit:cover}
.att-video{max-width:260px;border-radius:12px;display:block}
.att-file{display:flex;align-items:center;gap:8px;text-decoration:none;color:inherit;background:#0000000d;padding:7px 10px;border-radius:12px}
.att-file .fi{font-size:22px}.att-file .fn{max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rq{background:#00000014;border-left:3px solid var(--acc);border-radius:8px;padding:3px 8px;margin-bottom:4px;cursor:pointer}
.rq b{display:flex;align-items:center;gap:2px;color:var(--acc);font-size:12px}.rq span{display:block;font-size:12.5px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.vf{width:14px;height:14px;flex:none;vertical-align:-2px}
.avw{position:relative;display:inline-block;flex:none;line-height:0;vertical-align:middle}
.odot{position:absolute;right:0;bottom:1px;width:13px;height:13px;border-radius:50%;background:#31c55e;border:2.5px solid var(--bg);box-sizing:border-box}
.avbig+.odot{width:22px;height:22px;right:5px;bottom:5px;border-width:3px}
.row.on .odot{border-color:var(--acc)}
.onl{color:var(--acc);font-weight:500}
.row.on .onl,.row.on .sub .onl{color:#fff}
.scam{display:inline-block;border:1px solid #e5484d;color:#e5484d;border-radius:5px;font-size:10px;font-weight:700;padding:0 3px;margin-left:4px;letter-spacing:.4px;vertical-align:1px;line-height:1.35}
.pin{color:var(--sub);font-size:13px;margin-right:2px;flex:none}
.row.on .pin{color:#fff}
.row.pinned{background:var(--hov)}
:root[data-theme="dark"] .row.pinned,@media(prefers-color-scheme:dark){.row.pinned{background:#ffffff08}}
.row.pinned.on{background:var(--acc)}
.hav{line-height:0;flex:none;cursor:pointer}
.stats{display:flex;gap:8px;padding:10px 12px 6px;flex-wrap:wrap}
.st{flex:1 1 0;min-width:78px;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--glassb);border-radius:14px;padding:9px 6px;text-align:center}
.st b{display:block;font-size:20px;line-height:1.2}.st .sub{font-size:11px}
.subtabs{display:flex;gap:6px;padding:4px 12px 8px}
.subtabs button{flex:1;padding:8px;border-radius:12px;background:var(--hov);color:var(--sub);font-size:13px}
.subtabs button.on{background:var(--acc);color:#fff;font-weight:600}
.abtn{border:1px solid var(--line);border-radius:10px;padding:5px 8px;font-size:12px;white-space:nowrap;flex:none;color:var(--sub)}
.abtn.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.abtn.sc.on{background:#e5484d;border-color:#e5484d;color:#fff}
.warn{background:#e5484d1a;border:1px solid #e5484d55;color:#e5484d;border-radius:12px;padding:8px 10px;font-size:13px}
#cmp,#replybar{background:var(--glass);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%)}
#cmp{padding:8px;display:flex;gap:4px;align-items:center;border-top:1px solid var(--glassb)}
#cmp input{border-radius:20px}.ic{font-size:19px;padding:6px 8px;border-radius:50%;flex:none}.ic:hover{background:#0000000d}
#recbar{display:none;flex:1;align-items:center;gap:10px}#recbar i{width:10px;height:10px;border-radius:50%;background:#e5484d;animation:b 1s infinite}
@keyframes b{50%{opacity:.2}}
#replybar{display:none;align-items:center;gap:8px;padding:6px 12px;border-top:1px solid var(--glassb)}
#replybar .rp{flex:1;border-left:3px solid var(--acc);padding-left:8px;min-width:0}
#replybar .rp b{display:block;color:var(--acc);font-size:12px}#replybar .rp span{display:block;font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#modal{position:fixed;inset:0;background:#0006;backdrop-filter:blur(4px);display:grid;place-items:center;z-index:9}
#modal[hidden]{display:none}#box{background:var(--glass);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);border:1px solid var(--glassb);border-radius:18px;padding:16px;width:min(360px,92vw);max-height:80vh;overflow:auto;display:flex;flex-direction:column;gap:10px}
#toast{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:10px;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--glassb);border-left:4px solid var(--acc);padding:10px 14px;border-radius:12px;box-shadow:0 4px 20px #0004;display:none;z-index:10;cursor:pointer;max-width:80vw}
.set{padding:12px;display:flex;flex-direction:column;gap:10px}.set label{display:flex;justify-content:space-between;align-items:center;gap:8px}
.set .row2{display:flex;gap:6px}
[hidden]{display:none!important}
.rb{font-size:12px;color:var(--sub);opacity:.55;padding:0 3px}.rb:hover{opacity:1}
.rx{display:flex;gap:4px;flex-wrap:wrap}.rx:not(:empty){margin-top:4px}
.rx span{background:#0000000d;border-radius:12px;padding:0 7px;font-size:13px;cursor:pointer;color:var(--tx);border:1px solid transparent}.rx span.me{border-color:var(--acc)}
#pk{position:fixed;z-index:8;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--glassb);border-radius:22px;padding:4px 6px;box-shadow:0 4px 20px #0004;display:flex;gap:2px}
#pk button{font-size:22px;padding:2px 4px}
#mm{position:fixed;z-index:8;max-width:calc(100vw - 16px);background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--glassb);border-radius:12px;box-shadow:0 4px 20px #0004;overflow:hidden;display:flex;flex-direction:column;min-width:150px}
#mm button{padding:10px 14px;text-align:left;white-space:nowrap}#mm button:hover{background:#0000000d}
.m{-webkit-touch-callout:none;user-select:none}
.cf{position:fixed;top:40vh;width:8px;height:8px;border-radius:2px;pointer-events:none;z-index:99;animation:cf 1.4s ease-out forwards}
@keyframes cf{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--x),70vh) rotate(540deg);opacity:0}}
.hp{position:fixed;font-size:30px;pointer-events:none;z-index:99;animation:hp .9s ease-out forwards}
@keyframes hp{0%{transform:scale(.4) translateY(0);opacity:1}30%{transform:scale(1.3) translateY(-6px)}100%{transform:scale(1) translateY(-60px);opacity:0}}
.avbig{width:96px!important;height:96px!important;font-size:32px}
.tk{margin-left:2px;opacity:.8;letter-spacing:-2px}.tk.read{color:var(--acc);opacity:1}
#robar{padding:10px 14px;text-align:center;color:var(--sub);font-size:13px;background:var(--glass);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border-top:1px solid var(--glassb)}
#cmp textarea{border-radius:18px;resize:none;max-height:120px;overflow-y:auto;line-height:1.35;padding:9px 12px}
.wps{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 8px}
.wp{width:40px;height:40px;border-radius:10px;flex:none;border:2px solid transparent;background-size:cover;background-position:center}
.wp.on{border-color:var(--acc)}
@media(max-width:700px){#app{grid-template-columns:1fr}main{display:none}#app.open aside{display:none}#app.open main{display:flex}#back{display:block}
 #hd{gap:6px;padding:8px 8px}
 #hd .ic{font-size:17px;padding:5px 6px}
 #hd #back{font-size:20px;padding:2px 4px 2px 0}
 #htl{font-size:14.5px}#hsb{font-size:11.5px}
 .cb{width:56px;height:56px;font-size:22px}
 #cbtns{gap:14px}
 #cpeer .av{width:104px;height:104px;font-size:38px}
 #ringbox .av{width:96px;height:96px;font-size:34px}
 .m{max-width:86%}
}
/* Десктоп / широкие окна: центрируем ленту сообщений и композер, чтобы
   строки не растягивались на весь ультраширокий монитор, плюс более
   заметные hover-состояния — на десктопе всегда есть курсор мыши. */
@media(min-width:701px){
 .row:hover{background:var(--hov)}
 #msgs{padding-left:calc(50% - 340px);padding-right:calc(50% - 340px)}
 #msgs.wide{padding-left:12px;padding-right:12px}
 #cmp,#replybar{padding-left:calc(50% - 340px);padding-right:calc(50% - 340px)}
 @media(max-width:1180px){#msgs,#cmp,#replybar{padding-left:12px;padding-right:12px}}
 ::-webkit-scrollbar{width:9px;height:9px}
 ::-webkit-scrollbar-thumb{background:var(--glassb);border-radius:6px}
 ::-webkit-scrollbar-thumb:hover{background:var(--acc)}
 #app{grid-template-columns:360px 1fr}
}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
 aside,#hd,#cmp,#nav,#box,#toast,#pk,#mm,#auth,#replybar,.m{background:var(--bg)}
}
</style></head><body>
<div id="authwrap" hidden><div id="auth">

  <rect x="4" y="4" width="112" height="112" rx="28" fill="#0e0e18"/>

  <path d="M42 62c3 7 9 12 18 12s15-5 18-12c-4 6-10 9-18 9s-14-3-18-9z" fill="#0e0e18"/>
 </svg>
 <h1>SHADOW</h1><div class="sub" id="atag">Говори свободно</div>
 <div id="authland">
  <button class="pri" id="landStart">Начать</button>
  <button class="sec" id="landLogin">Войти</button>
 </div>
 <div id="authform" hidden>
  <div class="sub" id="asub">Без номера телефона. Только уникальный @username.</div>
  <div id="authaccs" hidden></div>
  <input id="au" placeholder="@username (a-z, 0-9, _)" maxlength="20" autocapitalize="off">
  <input id="an" placeholder="Имя (необязательно)" maxlength="30">
  <input id="ap" type="password" placeholder="Пароль (мин. 6 символов)" autocomplete="current-password"><button class="pri" id="ago">Создать аккаунт</button><button id="asw" class="sub"></button><button id="acancel" class="sub" hidden>← Вернуться к моему аккаунту</button>
  <button id="backland" class="sub" hidden>← Назад</button>
  <div class="err" id="ae"></div>
 </div>

/* ---------- несколько аккаунтов (как в Telegram) ----------
   Список сохранённых аккаунтов лежит в localStorage этого устройства.
   Пароль хранится в слегка запутанном виде — это защита от случайного

const XK=s=>s.split('').map((c,i)=>String.fromCharCode(c.charCodeAt(0)^((i*7+41)%251))).join('');
const encP=p=>{try{return btoa(XK(unescape(encodeURIComponent(p))))}catch(e){return''}};

 del(u){ACC.save(ACC.list().filter(a=>a.u!==u))},
 pass(u){const a=ACC.list().find(x=>x.u===u);return a&&a.p?decP(a.p):null}
};

async function purgeChat(id,kind){const c=S.chats[id];if(!c)return;
 const isCh=c.type==='channel',isGrp=c.type==='group';
 const label=isCh?'канал':isGrp?'группу':'переписку';
 if(!confirm('Удалить '+label+' у всех участников? Все сообщения будут стёрты безвозвратно.'))return;
 toast('Удаляю '+label+'…');
 try{for(let i=0;i<60;i++){const snap=await db.collection('chats/'+id+'/messages').limit(200).get();
   if(snap.empty)break;const b=db.batch();snap.docs.forEach(d=>b.delete(d.ref));await b.commit();if(snap.size<200)break}
  await db.doc('chats/'+id).delete();

 catch(e){toast(e.code==='permission-denied'?'Нет прав — переопубликуйте firestore.rules':'Не удалось удалить: '+(e.code||e.message))}}
function chatMenu(id,top,left){const c=S.chats[id];if(!c)return;const dm=c.type==='dm',ou=dm?other(c):null,isOwn=isGroupLike(c)&&c.by===S.me,mm=$('#mm');
 mm.innerHTML=(dm?`<button data-cact="prof" data-cid="${esc(id)}">👤 Профиль</button>`:'')+

 mm.hidden=false;mm.style.top=Math.min(innerHeight-130,Math.max(8,top))+'px';mm.style.left=Math.max(8,Math.min(innerWidth-8-mm.offsetWidth,left))+'px'}

/* ---------- общий AudioContext ----------
   Браузеры (особенно Safari/iOS) не дают звуку играть, пока пользователь
   хоть раз не коснулся страницы. Поэтому держим один контекст, который
   создаём/«будим» при первом же клике, и дальше переиспользуем его для
   любых звуков — и обычного бипа сообщений, и рингтона звонка, — уже без
   нового жеста.
   Также заранее выдаём разрешение играть звук через <audio> (нужно для
   входящих звонков, которые срабатывают без клика пользователя): на
   первый клик "прогреваем" скрытый audio-элемент, чтобы дальнейшие
   .play() у него не блокировались политикой автовоспроизведения. */
let ACTX=null;
function actx(){if(!ACTX){try{ACTX=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}
 if(ACTX.state==='suspended')ACTX.resume().catch(()=>{});return ACTX}
const audioUnlock=new Audio();audioUnlock.src='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';
audioUnlock.volume=0;
function unlockAudioOnce(){actx();audioUnlock.play().catch(()=>{});
 document.removeEventListener('pointerdown',unlockAudioOnce);document.removeEventListener('click',unlockAudioOnce)}
document.addEventListener('pointerdown',unlockAudioOnce,{once:true});
document.addEventListener('click',unlockAudioOnce,{once:true});
function tone(freq,dur,delay,vol){const a=actx();if(!a)return;
 const o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);
 o.frequency.value=freq;const t0=a.currentTime+(delay||0);
 g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(vol||.09,t0+.02);
 g.gain.exponentialRampToValueAtTime(.0001,t0+(dur||.25));o.start(t0);o.stop(t0+(dur||.25)+.02)}
function beep(){if(!S.snd)return;tone(800,.25,0,.08)}

/* =========================================================================
   PUSH-УВЕДОМЛЕНИЯ (Firebase Cloud Messaging), включая звонки в фоне.
   Пока вкладка открыта, новые сообщения и звонки видны через onSnapshot
   (см. enter()/watchCalls()) — это работает всегда и без всякой настройки.
   А вот когда вкладка/браузер закрыты или телефон заблокирован, показать
   уведомление может только настоящий push, доставленный через сервис-воркер.
   Для этого нужны ДВЕ половины:
    1) эта — клиентская: получаем разрешение, получаем FCM-токен устройства
       и сохраняем его в users/<me>/priv/push, чтобы было куда слать;
    2) серверная — облачная функция (см. functions/index.js в архиве),
       которая при новом сообщении/звонке реально ОТПРАВЛЯЕТ push на эти
       токены. Без неё токен просто лежит в базе и push не приходит —
       описание разворачивания смотрите в functions/README.md.
   ========================================================================= */
let swReg=null,MSG=null;
function getMessagingSafe(){if(MSG)return MSG;
 try{if(!firebase.messaging||!firebase.messaging.isSupported)return null;
  MSG=firebase.messaging();return MSG}catch(e){return null}}
async function enablePush(){
 try{
  if(!('serviceWorker' in navigator)||!window.FIREBASE_VAPID_KEY){return}
  swReg=swReg||await navigator.serviceWorker.ready.catch(()=>null);if(!swReg)return;
  const msg=getMessagingSafe();if(!msg)return;
  const token=await msg.getToken({vapidKey:window.FIREBASE_VAPID_KEY,serviceWorkerRegistration:swReg}).catch(()=>null);
  if(!token)return;
  ls.s('pushTok',token);
  await db.doc('users/'+S.me+'/priv/push').set({tokens:firebase.firestore.FieldValue.arrayUnion(token),ua:navigator.userAgent.slice(0,120),t:Date.now()},{merge:true}).catch(()=>{});
 }catch(e){/* тихо: пуш — необязательная возможность, не должен ронять приложение */}}
async function disablePush(){try{const tok=ls.g('pushTok');ls.d('pushTok');

function resizeImage(file,maxDim,quality){return new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(file);
 im.onload=()=>{let w=im.width,h=im.height;if(w>maxDim||h>maxDim){if(w>h){h=Math.round(h*maxDim/w);w=maxDim}else{w=Math.round(w*maxDim/h);h=maxDim}}
  const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',quality))};
 im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('img'))};im.src=u})}
function fileToDataURL(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(new Error('file'));r.readAsDataURL(f)})}
async function handleAttach(file){if(!file)return;
 if(file.size>20*1024*1024){toast('Файл больше 20 МБ — выберите поменьше');return}
 try{
  if(file.type.startsWith('image/')){
   let durl=await resizeImage(file,1280,.82);
   if(durl.length>870000)durl=await resizeImage(file,900,.68);
   if(durl.length>870000){toast('Не получилось сжать фото до нужного размера');return}
   send({type:'image',data:durl,name:file.name})
  }else{
   const durl=await fileToDataURL(file);
   if(durl.length>870000){toast('Файл слишком большой (лимит ~650 КБ — бесплатная база данных без Storage)');return}
   send({type:file.type.startsWith('video/')?'video':'file',data:durl,name:file.name,mime:file.type||'application/octet-stream'})
  }
 }catch(e){toast('Не удалось прикрепить файл')}}

/* ---------- rename username ---------- */
async function renameUsername(raw){
 const nu=(raw||'').replace(/^@/,'').toLowerCase().trim();
 if(!/^[a-z][a-z0-9]*(_[a-z0-9]+)*$/.test(nu)||nu.length<3||nu.length>20){toast('Ник: 3–20 символов, латиница/цифры, _ только внутри');return}
 if(nu===S.me){toast('Это ваш текущий юзернейм');return}
 const p=prompt('Введите пароль для подтверждения смены юзернейма');
 if(!p)return;
 const old=S.me,oldRef=db.doc('users/'+old),newRef=db.doc('users/'+nu);
 try{
  const cred=firebase.auth.EmailAuthProvider.credential(EM(old),p);
  await firebase.auth().currentUser.reauthenticateWithCredential(cred);
  const ex=await newRef.get();if(ex.exists){toast('Ник @'+nu+' уже занят');return}
  await firebase.auth().currentUser.updateEmail(EM(nu));
  await firebase.auth().currentUser.getIdToken(true);
  const meData=S.users[old]||{};
  await db.runTransaction(async tx=>{const check=await tx.get(newRef);if(check.exists)throw{code:'taken'};
   tx.set(newRef,{username:nu,name:meData.name||old,av:meData.av||null,createdAt:meData.createdAt||Date.now(),owner:S.uid});
   tx.update(oldRef,{renamedTo:nu})});
  try{const oldPriv=await db.doc('users/'+old+'/priv/contacts').get();
   await db.doc('users/'+nu+'/priv/contacts').set({list:(oldPriv.exists&&oldPriv.data().list)||[]})}catch(e){}
  ACC.rename(old,nu);S.me=nu;ls.s('me',nu);toast('Готово! Теперь вы @'+nu);render();if(S.cur)head()
 }catch(x){const k=x.code||'',M={'auth/wrong-password':'Неверный пароль','auth/invalid-credential':'Неверный пароль','auth/requires-recent-login':'Войдите заново и повторите','taken':'Ник уже занят','permission-denied':'Ник уже занят или нет доступа'};
  toast(M[k]||'Ошибка: '+(k||x.message))}}

/* =========================================================================
   ЗВОНКИ — аудио и видео, WebRTC. Медиа идут напрямую между устройствами,
   через Firestore передаётся только «рукопожатие» (offer/answer/ICE).
   Документ звонка живёт в calls/<id> и удаляется сразу после разговора.
   ========================================================================= */
/* STUN сам по себе не помогает, если оба собеседника сидят за "жёстким"
   NAT (мобильный интернет, офисный Wi-Fi и т.п.) — тогда прямое P2P-соединение
   не устанавливается вообще. TURN-сервер решает это, ретранслируя медиапоток
   через себя. Ниже — публичный бесплатный TURN (openrelay.metered.ca) как
   запасной вариант: он не требует денег и настройки, но общий и не даёт
   гарантий по нагрузке. Для по-настоящему надёжных звонков в проде замените
   его на свой TURN (Twilio/Xirsys/metered.ca платный тариф или свой coturn). */
const ICE={iceServers:[
 {urls:['stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302']},
 {urls:'stun:stun.cloudflare.com:3478'},
 {urls:'turn:openrelay.metered.ca:80',username:'openrelayproject',credential:'openrelayproject'},
 {urls:'turn:openrelay.metered.ca:443',username:'openrelayproject',credential:'openrelayproject'},
 {urls:'turn:openrelay.metered.ca:443?transport=tcp',username:'openrelayproject',credential:'openrelayproject'}
],iceCandidatePoolSize:4};
let CALL=null,RING=null,ringIv=null,durIv=null;
const callsCol=()=>db.collection('calls');
const callOk=()=>!!(window.RTCPeerConnection&&navigator.mediaDevices&&navigator.mediaDevices.getUserMedia);
const mediaWanted=t=>t==='video'?{audio:true,video:{width:{ideal:640},height:{ideal:480},facingMode:'user'}}:{audio:true};
const durTxt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');

/* рингтон звучит даже если звук сообщений выключен */
function ringBeep(){tone(660,.24,0,.14);tone(520,.24,.28,.14)}
function setCallStatus(txt){const e=$('#cstat');if(!e)return;
 if(txt){e.textContent=txt;return}
 if(CALL&&CALL.connectedAt)e.textContent=durTxt(Math.round((Date.now()-CALL.connectedAt)/1000));}
function openCallUI(){const u=CALL.peer,x=S.users[u]||{};
 $('#cav').innerHTML=av(u,x.name||u);
 $('#cname').innerHTML=dispName(u);
 $('#callui').hidden=false;
 $('#callui').classList.remove('hasvideo');
 $('#ccam').hidden=CALL.type!=='video';
 $('#cmic').textContent='🎤';$('#cmic').classList.remove('off');
 $('#ccam').textContent='🎥';$('#ccam').classList.remove('off');
 if(CALL.type==='video'){$('#lv').srcObject=CALL.local;$('#callui').classList.add('hasme')}
 else $('#callui').classList.remove('hasme');
 clearInterval(durIv);durIv=setInterval(()=>{if(CALL&&CALL.connectedAt)setCallStatus()},1000);
 try{document.documentElement.requestFullscreen&&0}catch(e){}}
function newPC(){const pc=new RTCPeerConnection(ICE);
 pc.ontrack=e=>{if(!CALL)return;
  const rs=CALL.remote||(CALL.remote=new MediaStream());
  (e.streams[0]?e.streams[0].getTracks():[e.track]).forEach(t=>{if(!rs.getTrackById(t.id))rs.addTrack(t)});
  $('#rv').srcObject=rs;
  if(rs.getVideoTracks().length)$('#callui').classList.add('hasvideo');
  $('#rv').play().catch(()=>{})};
 pc.onconnectionstatechange=()=>{if(!CALL||CALL.pc!==pc)return;
  const st=pc.connectionState;
  if(st==='connected'){CALL.connectedAt=CALL.connectedAt||Date.now();setCallStatus()}
  else if(st==='disconnected'){setCallStatus('связь прерывается…');
   /* сеть моргнула (переключение Wi-Fi↔моб.интернет и т.п.) — пробуем
      восстановить существующее соединение вместо немедленного разрыва */
   try{pc.restartIce&&pc.restartIce()}catch(e){}}
  else if(st==='failed'){setCallStatus('не удалось соединиться');
   setTimeout(()=>{if(CALL&&CALL.pc===pc&&pc.connectionState==='failed'){toast('Связь не установилась — возможно, мешает сеть или NAT');endCall('failed')}},3000)}};
 return pc}

async function startCall(peerRaw,type){
 if(CALL||RING){toast('Звонок уже идёт');return}
 if(!callOk()){toast('Этот браузер не умеет звонить');return}
 const u=resolveUser(peerRaw),x=S.users[u];
 if(!x||!x.owner){toast('Пользователь не найден');return}
 if(isBlocked(u)){toast('Пользователь в чёрном списке');return}
 if(!isOnline(u)&&!confirm('@'+u+' сейчас не в сети. Всё равно позвонить?'))return;
 let stream;
 try{stream=await navigator.mediaDevices.getUserMedia(mediaWanted(type))}
 catch(e){toast(type==='video'?'Нет доступа к камере и микрофону':'Нет доступа к микрофону');return}
 const id='call_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
 CALL={id,role:'caller',type,peer:u,local:stream,unsub:[],pend:[],ready:false};
 openCallUI();setCallStatus('вызываю…');
 const pc=CALL.pc=newPC(),ref=callsCol().doc(id);
 stream.getTracks().forEach(t=>pc.addTrack(t,stream));
 pc.onicecandidate=e=>{if(!e.candidate||!CALL)return;const c=e.candidate.toJSON();
  CALL.ready?ref.collection('a').add(c).catch(()=>{}):CALL.pend.push(c)};
 try{
  const offer=await pc.createOffer();await pc.setLocalDescription(offer);
  await ref.set({from:S.me,to:u,fromUid:S.uid,toUid:x.owner,uids:[S.uid,x.owner],type,state:'ringing',t:Date.now(),offer:{type:offer.type,sdp:offer.sdp}});
  CALL.ready=true;CALL.pend.splice(0).forEach(c=>ref.collection('a').add(c).catch(()=>{}));
 }catch(e){toast('Не удалось начать звонок: '+(e.code||e.message));endCall('error');return}
 CALL.unsub.push(ref.onSnapshot(async snap=>{if(!CALL||CALL.id!==id)return;
  const d=snap.data();
  if(!d){endCall('remote');return}
  if(d.state==='declined'){toast('@'+u+' отклонил звонок');endCall('remote');return}
  if(d.state==='ended'){endCall('remote');return}
  if(d.answer&&CALL.pc.signalingState==='have-local-offer'){
   try{await CALL.pc.setRemoteDescription(new RTCSessionDescription(d.answer));
    CALL.connectedAt=CALL.connectedAt||Date.now();setCallStatus()}catch(e){}}},()=>{}));
 CALL.unsub.push(ref.collection('b').onSnapshot(s=>{s.docChanges().forEach(c=>{
  if(c.type==='added'&&CALL&&CALL.id===id)CALL.pc.addIceCandidate(new RTCIceCandidate(c.doc.data())).catch(()=>{})})},()=>{}));
 CALL.noAnswer=setTimeout(()=>{if(CALL&&CALL.id===id&&!CALL.connectedAt){toast('@'+u+' не отвечает');endCall('timeout')}},45000)}

async function answerCall(){if(!RING||CALL)return;
 const {id,d}=RING;stopRing();
 let stream;
 try{stream=await navigator.mediaDevices.getUserMedia(mediaWanted(d.type))}
 catch(e){toast('Нет доступа к микрофону/камере');declineCall(id);return}
 CALL={id,role:'callee',type:d.type,peer:resolveUser(d.from),local:stream,unsub:[],pend:[],ready:true};
 openCallUI();setCallStatus('соединяем…');
 const pc=CALL.pc=newPC(),ref=callsCol().doc(id);
 stream.getTracks().forEach(t=>pc.addTrack(t,stream));
 pc.onicecandidate=e=>{if(e.candidate)ref.collection('b').add(e.candidate.toJSON()).catch(()=>{})};
 try{
  await pc.setRemoteDescription(new RTCSessionDescription(d.offer));
  const ans=await pc.createAnswer();await pc.setLocalDescription(ans);
  await ref.update({answer:{type:ans.type,sdp:ans.sdp},state:'accepted'});
 }catch(e){toast('Не удалось принять звонок: '+(e.code||e.message));endCall('error');return}
 CALL.connectedAt=Date.now();setCallStatus();
 CALL.unsub.push(ref.collection('a').onSnapshot(s=>{s.docChanges().forEach(c=>{
  if(c.type==='added'&&CALL&&CALL.id===id)CALL.pc.addIceCandidate(new RTCIceCandidate(c.doc.data())).catch(()=>{})})},()=>{}));
 CALL.unsub.push(ref.onSnapshot(snap=>{if(!CALL||CALL.id!==id)return;
  const x=snap.data();if(!x||x.state==='ended')endCall('remote')},()=>{}))}

function declineCall(idArg){const id=idArg||(RING&&RING.id);stopRing();
 if(id)callsCol().doc(id).update({state:'declined',by:S.me}).catch(()=>{})}

function endCall(reason){if(!CALL)return;const c=CALL;CALL=null;
 clearTimeout(c.noAnswer);clearInterval(durIv);durIv=null;
 (c.unsub||[]).forEach(f=>{try{f()}catch(e){}});
 try{c.pc&&c.pc.close()}catch(e){}
 try{(c.local?c.local.getTracks():[]).forEach(t=>t.stop())}catch(e){}
 $('#rv').srcObject=null;$('#lv').srcObject=null;
 $('#callui').hidden=true;$('#callui').classList.remove('hasvideo','hasme');
 if(reason!=='remote')callsCol().doc(c.id).update({state:'ended',by:S.me}).catch(()=>{});
 setTimeout(()=>wipeCall(c.id),3000);
 if(c.role==='caller')logCall(c.peer,c.type,c.connectedAt?Math.round((Date.now()-c.connectedAt)/1000):0,reason)}

async function wipeCall(id){try{const ref=callsCol().doc(id);
 for(const sub of ['a','b']){const s=await ref.collection(sub).limit(300).get();
  if(s.empty)continue;const b=db.batch();s.docs.forEach(d=>b.delete(d.ref));await b.commit()}
 await ref.delete()}catch(e){}}

async function logCall(peer,type,dur,reason){try{
 const x=S.users[peer];if(!x||!x.owner)return;
 const id=dmId(S.uid,x.owner);if(!S.chats[id])return;
 const txt=(type==='video'?'🎥 Видеозвонок':'📞 Аудиозвонок')+' · '+
  (dur?durTxt(dur):reason==='timeout'?'без ответа':'не состоялся');
 const t=Date.now();
 await db.collection('chats/'+id+'/messages').add({from:S.me,t,type:'text',text:txt});
 await db.doc('chats/'+id).update({last:{from:S.me,t,k:'text',text:txt},lastAt:t})}catch(e){}}

function toggleMic(){if(!CALL)return;const t=(CALL.local.getAudioTracks()||[])[0];if(!t)return;
 t.enabled=!t.enabled;$('#cmic').textContent=t.enabled?'🎤':'🔇';$('#cmic').classList.toggle('off',!t.enabled)}
function toggleCam(){if(!CALL)return;const t=(CALL.local.getVideoTracks()||[])[0];if(!t)return;
 t.enabled=!t.enabled;$('#ccam').textContent=t.enabled?'🎥':'🚫';$('#ccam').classList.toggle('off',!t.enabled);
 $('#callui').classList.toggle('hasme',t.enabled)}

/* --- входящий звонок --- */
function showRing(id,d){RING={id,d};const u=resolveUser(d.from),x=S.users[u]||{};
 $('#rav').innerHTML=av(u,x.name||u);
 $('#rname').innerHTML=dispName(u);
 $('#rkind').textContent=(d.type==='video'?'Входящий видеозвонок':'Входящий аудиозвонок');
 $('#ringui').hidden=false;
 clearInterval(ringIv);ringBeep();ringIv=setInterval(ringBeep,1900);
 try{navigator.vibrate&&navigator.vibrate([400,300,400])}catch(e){}
 try{if(window.Notification&&Notification.permission==='granted'&&ls.g('ntf')!=='0')
  new Notification(uname(u),{body:d.type==='video'?'🎥 Видеозвонок':'📞 Аудиозвонок',icon:'icons/icon-192.png',badge:'icons/icon-96.png',tag:'call-'+id,requireInteraction:true})}catch(e){}
 RING.to=setTimeout(()=>{if(RING&&RING.id===id)declineCall(id)},45000)}
function stopRing(){clearInterval(ringIv);ringIv=null;if(RING)clearTimeout(RING.to);RING=null;$('#ringui').hidden=true}
function watchCalls(){if(!callOk())return;
 callsCol().where('uids','array-contains',S.uid).onSnapshot(s=>{
  s.docChanges().forEach(ch=>{const d=ch.doc.data(),id=ch.doc.id;if(!d)return;
   if(d.toUid!==S.uid)return;
   if(ch.type==='removed'){if(RING&&RING.id===id)stopRing();return}
   if(d.state==='ringing'){
    if(CALL||RING)return;
    if(Date.now()-(d.t||0)>60000)return;
    if(isBlocked(d.from))return;
    showRing(id,d)}
   else if(RING&&RING.id===id)stopRing()})},()=>{})}
window.addEventListener('beforeunload',()=>{if(CALL)endCall();else if(RING)declineCall()});

/* =========================================================================
   КОММЕНТАРИИ К ПОСТАМ КАНАЛА — как в Telegram: писать может любой
   участник канала (даже если сам канал ему недоступен для постинга),
   счётчик "cc" хранится прямо в документе поста и приходит вместе с ним
   через уже открытую подписку на сообщения — без лишних чтений.

let cmtChat=null,cmtMsg=null,cmtUnsub=null;

function commentsModal(chatId,msgId){closeCmt();cmtChat=chatId;cmtMsg=msgId;
 const readOnly=S.adminMode;

  list.scrollTop=list.scrollHeight},()=>{$('#cmtlist').innerHTML='<div class="sub">Ошибка загрузки</div>'});
 $('#cmtclose').onclick=()=>{closeCmt();$('#modal').hidden=true};
 if(!readOnly){

 catch(e){toast('Не удалось удалить: '+(e.code||e.message))}}
