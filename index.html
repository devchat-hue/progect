<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1a1e" media="(prefers-color-scheme: dark)">
<title>Анонимный мессенджер</title>
<style>
:root{--bg:#fff;--tx:#111;--sub:#707579;--acc:#3390ec;--out:rgba(199,255,163,.62);--in:rgba(255,255,255,.66);--line:#e7e7e7;--hov:#f4f4f5;--wall:#cfdcc4;--glass:rgba(255,255,255,.55);--glassb:rgba(255,255,255,.55);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1a1e;--tx:#f5f5f5;--sub:#8d9499;--acc:#8f7ff0;--out:rgba(118,106,200,.55);--in:rgba(44,44,49,.6);--line:#303030;--hov:#2c2c2c;--wall:#0f0f0f;--glass:rgba(32,32,38,.55);--glassb:rgba(255,255,255,.09)}}
:root[data-theme="dark"]{--bg:#1a1a1e;--tx:#f5f5f5;--sub:#8d9499;--acc:#8f7ff0;--out:rgba(118,106,200,.55);--in:rgba(44,44,49,.6);--line:#303030;--hov:#2c2c2c;--wall:#0f0f0f;--glass:rgba(32,32,38,.55);--glassb:rgba(255,255,255,.09)}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:radial-gradient(circle at 10% 15%,#ff9a9e3d 0,transparent 45%),radial-gradient(circle at 90% 10%,#6ec6ff40 0,transparent 45%),radial-gradient(circle at 50% 90%,#a78bfa3d 0,transparent 50%),radial-gradient(circle at 92% 92%,#34d3993d 0,transparent 45%),var(--bg);background-attachment:fixed;color:var(--tx);font:15px/1.4 -apple-system,"Segoe UI",Roboto,sans-serif}
button,input{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none;touch-action:manipulation}
input,textarea{background:var(--hov);border:1px solid var(--line);border-radius:14px;padding:10px 12px;outline:none;width:100%;font:inherit;color:inherit}
input:focus,textarea:focus{border-color:var(--acc)}
.pri{background:var(--acc);color:#fff;border-radius:14px;padding:10px 16px;font-weight:600}
#auth{max-width:340px;margin:12vh auto;padding:22px;display:flex;flex-direction:column;gap:12px;text-align:center;border-radius:22px}
#auth h1{margin:0;font-size:22px}.err{color:#e5484d;min-height:20px;font-size:13px}.sub{color:var(--sub);font-size:13px}
#app{display:grid;grid-template-columns:340px 1fr;height:100%}
aside{border-right:1px solid var(--glassb);display:flex;flex-direction:column;min-height:0}
.top{padding:10px}#list{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.row{display:flex;gap:10px;padding:9px 12px;align-items:center;cursor:pointer;touch-action:manipulation}.row:hover{background:var(--hov)}.row.on{background:var(--acc);color:#fff}.row.on .sub{color:#e8e8ff}
.av{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:600;overflow:hidden}
.mid{flex:1;min-width:0}.mid b,.mid .sub{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bd{background:var(--acc);color:#fff;border-radius:12px;min-width:20px;padding:0 6px;text-align:center;font-size:12px}
.row.on .bd{background:#fff;color:var(--acc)}
#nav{display:flex;border-top:1px solid var(--glassb)}#nav button{flex:1;padding:12px;color:var(--sub)}#nav button.on{color:var(--acc);font-weight:600}
main{display:flex;flex-direction:column;min-height:0;background:var(--wall);position:relative}
#empty{margin:auto;background:#0003;color:#fff;padding:4px 14px;border-radius:14px}
#cv{display:flex;flex-direction:column;height:100%}
#hd{background:var(--glass);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);padding:8px 12px;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--glassb)}
#back{display:none;font-size:22px;color:var(--acc)}
#msgs{flex:1;overflow:auto;padding:10px 12px;display:flex;flex-direction:column;gap:4px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.m{max-width:min(78%,420px);padding:6px 10px;border-radius:14px;background:var(--in);backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);border:1px solid var(--glassb);word-wrap:break-word;white-space:pre-wrap;position:relative}
.m.me{align-self:flex-end;background:var(--out);color:var(--tx)}
:root[data-theme="dark"] .m.me{color:#fff}
.m .n{color:var(--acc);font-size:12px;font-weight:600;display:flex;align-items:center;gap:2px}.m .t{font-size:11px;color:var(--sub);text-align:right;display:flex;align-items:center;justify-content:flex-end;gap:2px}
.m.flash{animation:fl .9s}@keyframes fl{0%,100%{box-shadow:none}30%{box-shadow:0 0 0 3px var(--acc)}}
audio{height:36px;max-width:100%}
.circ{width:200px;height:200px;border-radius:50%;object-fit:cover;background:#000;display:block;cursor:pointer}
.m.circle-msg{background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;border:0;padding:0;max-width:200px}
.m.circle-msg .t{background:var(--bg);border-radius:10px;padding:1px 6px;display:inline-flex;margin-top:4px}
.m.circle-msg .rx:not(:empty){margin-top:4px}
.att-img{max-width:260px;max-height:320px;border-radius:12px;display:block;cursor:pointer;object-fit:cover}
.att-video{max-width:260px;border-radius:12px;display:block}
.att-file{display:flex;align-items:center;gap:8px;text-decoration:none;color:inherit;background:#0000000d;padding:7px 10px;border-radius:12px}
.att-file .fi{font-size:22px}.att-file .fn{max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rq{background:#00000014;border-left:3px solid var(--acc);border-radius:8px;padding:3px 8px;margin-bottom:4px;cursor:pointer}
.rq b{display:flex;align-items:center;gap:2px;color:var(--acc);font-size:12px}.rq span{display:block;font-size:12.5px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.vf{width:14px;height:14px;flex:none;vertical-align:-2px}
#cmp,#replybar{background:var(--glass);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%)}
#cmp{padding:8px;display:flex;gap:4px;align-items:center;border-top:1px solid var(--glassb)}
#cmp input{border-radius:20px}.ic{font-size:19px;padding:6px 8px;border-radius:50%;flex:none}.ic:hover{background:#0000000d}
#recbar{display:none;flex:1;align-items:center;gap:10px}#recbar i{width:10px;height:10px;border-radius:50%;background:#e5484d;animation:b 1s infinite}
@keyframes b{50%{opacity:.2}}
#prev{position:absolute;right:16px;bottom:80px;width:160px;height:160px;border-radius:50%;object-fit:cover;border:3px solid var(--acc);display:none;background:#000}
#replybar{display:none;align-items:center;gap:8px;padding:6px 12px;border-top:1px solid var(--glassb)}
#replybar .rp{flex:1;border-left:3px solid var(--acc);padding-left:8px;min-width:0}
#replybar .rp b{display:block;color:var(--acc);font-size:12px}#replybar .rp span{display:block;font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#modal{position:fixed;inset:0;background:#0006;backdrop-filter:blur(4px);display:grid;place-items:center;z-index:9}
#modal[hidden]{display:none}#box{background:var(--glass);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);border:1px solid var(--glassb);border-radius:18px;padding:16px;width:min(360px,92vw);max-height:80vh;overflow:auto;display:flex;flex-direction:column;gap:10px}
#toast{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:10px;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--glassb);border-left:4px solid var(--acc);padding:10px 14px;border-radius:12px;box-shadow:0 4px 20px #0004;display:none;z-index:10;cursor:pointer;max-width:80vw}
.set{padding:12px;display:flex;flex-direction:column;gap:10px}.set label{display:flex;justify-content:space-between;align-items:center;gap:8px}
.set .row2{display:flex;gap:6px}
[hidden]{display:none!important}
.rb{font-size:12px;color:var(--sub);opacity:.55;padding:0 3px}.rb:hover{opacity:1}
.rx{display:flex;gap:4px;flex-wrap:wrap}.rx:not(:empty){margin-top:4px}
.rx span{background:#0000000d;border-radius:12px;padding:0 7px;font-size:13px;cursor:pointer;color:var(--tx);border:1px solid transparent}.rx span.me{border-color:var(--acc)}
#pk{position:fixed;z-index:8;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--glassb);border-radius:22px;padding:4px 6px;box-shadow:0 4px 20px #0004;display:flex;gap:2px}
#pk button{font-size:22px;padding:2px 4px}
#mm{position:fixed;z-index:8;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--glassb);border-radius:12px;box-shadow:0 4px 20px #0004;overflow:hidden;display:flex;flex-direction:column;min-width:150px}
#mm button{padding:9px 14px;text-align:left}#mm button:hover{background:#0000000d}
.m{-webkit-touch-callout:none;user-select:none}
.cf{position:fixed;top:40vh;width:8px;height:8px;border-radius:2px;pointer-events:none;z-index:99;animation:cf 1.4s ease-out forwards}
@keyframes cf{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--x),70vh) rotate(540deg);opacity:0}}
.hp{position:fixed;font-size:30px;pointer-events:none;z-index:99;animation:hp .9s ease-out forwards}
@keyframes hp{0%{transform:scale(.4) translateY(0);opacity:1}30%{transform:scale(1.3) translateY(-6px)}100%{transform:scale(1) translateY(-60px);opacity:0}}
.avbig{width:96px!important;height:96px!important;font-size:32px}
.tk{margin-left:2px;opacity:.8;letter-spacing:-2px}.tk.read{color:var(--acc);opacity:1}
#robar{padding:10px 14px;text-align:center;color:var(--sub);font-size:13px;background:var(--glass);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border-top:1px solid var(--glassb)}
#cmp textarea{border-radius:18px;resize:none;max-height:120px;overflow-y:auto;line-height:1.35;padding:9px 12px}
.wps{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 8px}
.wp{width:40px;height:40px;border-radius:10px;flex:none;border:2px solid transparent;background-size:cover;background-position:center}
.wp.on{border-color:var(--acc)}
@media(max-width:700px){#app{grid-template-columns:1fr}main{display:none}#app.open aside{display:none}#app.open main{display:flex}#back{display:block}}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
 aside,#hd,#cmp,#nav,#box,#toast,#pk,#mm,#auth,#replybar,.m{background:var(--bg)}
}
</style></head><body>
<div id="auth" hidden>
 <h1>Анонимный мессенджер</h1><div class="sub">Без номера телефона. Только уникальный @username.</div>
 <input id="au" placeholder="@username (a-z, 0-9, _)" maxlength="20" autocapitalize="off">
 <input id="an" placeholder="Имя (необязательно)" maxlength="30">
 <input id="ap" type="password" placeholder="Пароль (мин. 6 символов)" autocomplete="current-password"><button class="pri" id="ago">Создать аккаунт</button><button id="asw" class="sub"></button><div class="err" id="ae"></div>
</div>
<div id="app" hidden>
 <aside><div class="top"><input id="q" placeholder="Точный @username человека"></div><div id="list"></div>
  <nav id="nav"><button data-t="chats">Чаты</button><button data-t="contacts">Контакты</button><button data-t="settings">Настройки</button><button data-t="admin" id="navadmin" hidden>Админ</button></nav></aside>
 <main><div id="empty">Выберите чат</div>
  <section id="cv" hidden>
   <div id="hd"><button id="back">‹</button><div class="av" id="hav"></div><div class="mid"><b id="htl"></b><span class="sub" id="hsb"></span></div><button class="ic" id="addm" title="Добавить участников" hidden>➕</button></div>
   <div id="msgs"></div><video id="prev" muted playsinline></video>
   <div id="replybar"><div class="rp"><b id="rpn"></b><span id="rpt"></span></div><button class="ic" id="rpx">✕</button></div>
   <div id="robar" hidden></div>
   <div id="cmp"><textarea id="tx" rows="1" placeholder="Сообщение" autocomplete="off"></textarea><div id="recbar"><i></i><span id="rt">0:00</span><button id="rc">✕</button></div>
    <button class="ic" id="ba" title="Прикрепить фото / видео / файл">📎</button><button class="ic" id="bv" title="Голосовое">🎤</button><button class="ic" id="bc" title="Кружок">⭕</button><button class="ic" id="bs" title="Отправить">➤</button></div>
  </section></main>
</div>
<div id="modal" hidden><div id="box"></div></div><div id="toast"></div><input type="file" id="avf" accept="image/*" hidden><input type="file" id="atf" hidden><input type="file" id="wpf" accept="image/*" hidden>
<div id="mm" hidden></div>
<div id="pk" hidden><button data-e="👍">👍</button><button data-e="❤️">❤️</button><button data-e="😂">😂</button><button data-e="😮">😮</button><button data-e="😢">😢</button><button data-e="🔥">🔥</button></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={g(k){try{return localStorage.getItem(k)}catch(e){return null}},s(k,v){try{localStorage.setItem(k,v)}catch(e){}},d(k){try{localStorage.removeItem(k)}catch(e){}}};
const S={me:ls.g('me'),users:{},chats:{},cur:null,tab:'chats',q:'',un:{},t0:Date.now(),snd:ls.g('snd')!=='0',reads:JSON.parse(ls.g('reads')||'{}'),shown:new Set(),replyTo:null,msgs:{},myContacts:[],adminMode:false,adminChats:{}};
let db,msgUn=null,Q=Promise.resolve(),R=null;
const COL=['#e17076','#7bc862','#e5ca77','#65aadd','#a695e7','#ee7aae','#6ec9cb','#faa774'];
const col=s=>COL[[...s].reduce((a,c)=>a+c.charCodeAt(0),0)%8];
const AVR=/^data:image\/(jpeg|png|webp);base64,/;
const av=(s,t,cls)=>{const x=S.users[s];return `<div class="av ${cls||''}" style="background:${col(s)}">${x&&AVR.test(x.av||'')?`<img src="${x.av}" alt="" style="width:100%;height:100%;border-radius:50%;object-fit:cover">`:esc((t||s)[0]||'?').toUpperCase()}</div>`};
const tm=t=>new Date(t).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
const uname=u=>S.users[u]?.name||u;
const CREATOR='temqua';
const isCreator=u=>u===CREATOR;
const bmark=u=>isCreator(u)?'<svg class="vf" viewBox="0 0 24 24" aria-label="Создатель"><circle cx="12" cy="12" r="11" fill="#2ea1ff"/><path d="M7 12.4l3.2 3.2L17.2 8" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>':'';
const dispName=u=>esc(uname(u))+bmark(u);
function resolveUser(u){let x=S.users[u],seen=new Set();while(x&&x.renamedTo&&!seen.has(x.renamedTo)){seen.add(x.renamedTo);const nx=S.users[x.renamedTo];if(!nx)break;u=x.renamedTo;x=nx}return u}
function uidToUser(uid){let fb=null;for(const k in S.users){const x=S.users[k];if(x.owner===uid){if(!x.renamedTo)return k;fb=fb||k}}return fb}
const dmId=(a,b)=>'dm_'+[a,b].sort().join('__');
function other(c){if(c.type==='dm'){const ou=(c.uids||[]).find(x=>x!==S.uid);return (ou&&uidToUser(ou))||(c.members||[]).find(m=>m!==S.me)||'?'}return (c.members||[]).find(m=>m!==S.me)||S.me}
const isGroupLike=c=>c.type==='group'||c.type==='channel';
const ctitle=(id)=>{const c=S.chats[id];return isGroupLike(c)?c.title:uname(other(c))};
function canWrite(c){if(!c)return false;if(c.type!=='channel')return true;return c.by===S.me||(c.admins||[]).includes(S.me)}
function toast(t,f){const e=$('#toast');e.textContent=t;e.style.display='block';e.onclick=()=>{e.style.display='none';f&&f()};clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display='none',5000)}
function beep(){if(!S.snd)return;try{const a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=800;g.gain.setValueAtTime(.08,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.25);o.start();o.stop(a.currentTime+.25)}catch(e){}}
function badge(){const n=Object.values(S.un).reduce((a,b)=>a+b,0);document.title=(n?`(${n}) `:'')+'Мессенджер'}
function unread(id){const c=S.chats[id];if(S.un[id])return S.un[id];return c.last&&c.last.from!==S.me&&c.last.t>(S.reads[id]||0)?1:0}
function markRead(id){S.un[id]=0;const c=S.chats[id];const val=Math.max(Date.now(),c?.last?.t||0);S.reads[id]=val;ls.s('reads',JSON.stringify(S.reads));badge();
 if(c&&db){const prev=(c.reads&&c.reads[S.me])||0;if(val>prev){c.reads=c.reads||{};c.reads[S.me]=val;
  db.doc('chats/'+id).update({['reads.'+S.me]:val}).catch(()=>{})}}}

/* ---------- wallpaper ---------- */
const WALLS={ocean:'linear-gradient(160deg,#1e3c72,#2a5298)',sunset:'linear-gradient(160deg,#ff9966,#ff5e62)',mint:'linear-gradient(160deg,#5ee7df,#b490ca)',slate:'linear-gradient(160deg,#232526,#414345)'};
function applyWallpaper(){const m=document.querySelector('main');if(!m)return;const img=ls.g('wallImg'),preset=ls.g('wallPreset');
 if(img){m.style.backgroundImage=`url(${img})`;m.style.backgroundSize='cover';m.style.backgroundPosition='center'}
 else if(preset&&WALLS[preset]){m.style.backgroundImage=WALLS[preset];m.style.backgroundSize=''}
 else m.style.backgroundImage=''}

/* ---------- fun little easter eggs ---------- */
function confetti(){const n=26;for(let i=0;i<n;i++){const s=document.createElement('span');s.className='cf';s.style.left=(42+Math.random()*16)+'vw';s.style.background=COL[i%COL.length];s.style.animationDelay=(Math.random()*.2)+'s';s.style.setProperty('--x',(Math.random()*220-110)+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),1700)}}
function popHeart(el){const h=document.createElement('span');h.className='hp';h.textContent='❤️';const r=el.getBoundingClientRect();h.style.left=(r.left+r.width/2-15)+'px';h.style.top=(r.top+r.height/2-15)+'px';document.body.appendChild(h);setTimeout(()=>h.remove(),900)}

/* ---------- auth ---------- */
let AM='reg';const EM=u=>u+'@messenger.app';
function setMode(m){AM=m;$('#an').hidden=m==='login';$('#ago').textContent=m==='reg'?'Создать аккаунт':'Войти';$('#asw').textContent=m==='reg'?'Уже есть аккаунт? Войти':'Нет аккаунта? Регистрация';$('#ae').textContent=''}
async function boot(user){S.uid=user.uid;S.me=user.email.split('@')[0];const r=db.doc('users/'+S.me),x=await r.get();
 if(!x.exists)await r.set({username:S.me,name:$('#an').value.trim()||S.me,createdAt:Date.now(),owner:S.uid});ls.s('me',S.me);enter()}
async function register(){
 const u=$('#au').value.trim().replace(/^@/,'').toLowerCase(),n=$('#an').value.trim()||u,p=$('#ap').value,e=$('#ae');e.textContent='';
 if(!/^[a-z][a-z0-9]*(_[a-z0-9]+)*$/.test(u)||u.length<3){e.textContent='Ник: 3–20 символов, латиница/цифры, _ только внутри';return}
 if(p.length<6){e.textContent='Пароль — минимум 6 символов';return}
 $('#ago').disabled=true;
 try{const A=firebase.auth();
  if(AM==='login'){const c=await A.signInWithEmailAndPassword(EM(u),p);await boot(c.user)}
  else{const c=await A.createUserWithEmailAndPassword(EM(u),p);S.uid=c.user.uid;const r=db.doc('users/'+u);
   try{await db.runTransaction(async tx=>{if((await tx.get(r)).exists)throw{code:'taken'};tx.set(r,{username:u,name:n,createdAt:Date.now(),owner:S.uid})})}
   catch(x){await c.user.delete().catch(()=>{});throw x}
   S.me=u;ls.s('me',u);enter()}
 }catch(x){const k=x.code||'',M={'auth/email-already-in-use':'Ник @'+u+' уже занят','taken':'Ник @'+u+' уже занят','permission-denied':'Ник @'+u+' уже занят','auth/invalid-credential':'Неверный ник или пароль','auth/wrong-password':'Неверный ник или пароль','auth/user-not-found':'Неверный ник или пароль','auth/too-many-requests':'Слишком много попыток, подождите','auth/operation-not-allowed':'В Firebase не включён вход Email/Password','auth/weak-password':'Слишком простой пароль'};
  e.textContent=M[k]||'Ошибка: '+(k||x.message)}finally{$('#ago').disabled=false}
}
let entered=false;
function enter(){if(entered)return;entered=true;
 $('#auth').hidden=true;$('#app').hidden=false;S.t0=Date.now();

/* ---------- attachments (photo / video / file) ---------- */
function resizeImage(file,maxDim,quality){return new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(file);
 im.onload=()=>{let w=im.width,h=im.height;if(w>maxDim||h>maxDim){if(w>h){h=Math.round(h*maxDim/w);w=maxDim}else{w=Math.round(w*maxDim/h);h=maxDim}}
  const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',quality))};
 im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('img'))};im.src=u})}
function fileToDataURL(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(new Error('file'));r.readAsDataURL(f)})}
async function handleAttach(file){if(!file)return;
 if(file.size>20*1024*1024){toast('Файл больше 20 МБ — выберите поменьше');return}
 try{
  if(file.type.startsWith('image/')){
   let durl=await resizeImage(file,1280,.82);
   if(durl.length>870000)durl=await resizeImage(file,900,.68);
   if(durl.length>870000){toast('Не получилось сжать фото до нужного размера');return}
   send({type:'image',data:durl,name:file.name})
  }else{
   const durl=await fileToDataURL(file);
   if(durl.length>870000){toast('Файл слишком большой (лимит ~650 КБ — бесплатная база данных без Storage)');return}
   send({type:file.type.startsWith('video/')?'video':'file',data:durl,name:file.name,mime:file.type||'application/octet-stream'})
  }
 }catch(e){toast('Не удалось прикрепить файл')}}
function openImg(id){const m=S.msgs[id];if(!m||!m.data)return;
 $('#box').innerHTML=`<img src="${m.data}" style="max-width:100%;border-radius:12px;display:block;margin:auto">${m.name?`<div class="sub" style="text-align:center">${esc(m.name)}</div>`:''}<button id="dlimg" class="pri">Скачать</button>`;
 $('#modal').hidden=false;$('#dlimg').onclick=()=>{const a=document.createElement('a');a.href=m.data;a.download=m.name||'image.jpg';a.click()}}

 catch(e){toast('Нет доступа к микрофону/камере. Разрешите его в браузере');return}
 const max=kind==='circle'?20:120,ch=[],mr=new MediaRecorder(st,{audioBitsPerSecond:16000,videoBitsPerSecond:150000});
 R={mr,st,cancel:false,t0:Date.now()};mr.ondataavailable=e=>e.data.size&&ch.push(e.data);

  if(c||!ch.length)return;const fr=new FileReader();fr.onload=()=>{if(fr.result.length>900000){toast('Запись слишком большая — сделайте короче');return}send({type:kind,data:fr.result,dur})};fr.readAsDataURL(new Blob(ch,{type:mr.mimeType}))};
 if(kind==='circle'){$('#prev').srcObject=st;$('#prev').style.display='block';$('#prev').play()}

/* ---------- rename username ---------- */
async function renameUsername(raw){
 const nu=(raw||'').replace(/^@/,'').toLowerCase().trim();
 if(!/^[a-z][a-z0-9]*(_[a-z0-9]+)*$/.test(nu)||nu.length<3||nu.length>20){toast('Ник: 3–20 символов, латиница/цифры, _ только внутри');return}
 if(nu===S.me){toast('Это ваш текущий юзернейм');return}
 const p=prompt('Введите пароль для подтверждения смены юзернейма');
 if(!p)return;
 const old=S.me,oldRef=db.doc('users/'+old),newRef=db.doc('users/'+nu);
 try{
  const cred=firebase.auth.EmailAuthProvider.credential(EM(old),p);
  await firebase.auth().currentUser.reauthenticateWithCredential(cred);
  const ex=await newRef.get();if(ex.exists){toast('Ник @'+nu+' уже занят');return}
  await firebase.auth().currentUser.updateEmail(EM(nu));
  await firebase.auth().currentUser.getIdToken(true);
  const meData=S.users[old]||{};
  await db.runTransaction(async tx=>{const check=await tx.get(newRef);if(check.exists)throw{code:'taken'};
   tx.set(newRef,{username:nu,name:meData.name||old,av:meData.av||null,createdAt:meData.createdAt||Date.now(),owner:S.uid});
   tx.update(oldRef,{renamedTo:nu})});
  try{const oldPriv=await db.doc('users/'+old+'/priv/contacts').get();
   await db.doc('users/'+nu+'/priv/contacts').set({list:(oldPriv.exists&&oldPriv.data().list)||[]})}catch(e){}
  S.me=nu;ls.s('me',nu);toast('Готово! Теперь вы @'+nu);render();if(S.cur)head()
 }catch(x){const k=x.code||'',M={'auth/wrong-password':'Неверный пароль','auth/invalid-credential':'Неверный пароль','auth/requires-recent-login':'Войдите заново и повторите','taken':'Ник уже занят','permission-denied':'Ник уже занят или нет доступа'};
  toast(M[k]||'Ошибка: '+(k||x.message))}}
